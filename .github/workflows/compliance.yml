name: Dependency and License Compliance

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  compliance:
    name: ${{ matrix.check-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Preserve the existing Ubuntu check name for branch-rule compatibility.
          - os: ubuntu-latest
            check-name: compliance
          - os: windows-2025
            check-name: compliance-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record runner and tool versions
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module -e 'import os from "node:os"; console.log(JSON.stringify({head:process.env.HEAD_SHA,checkout:process.env.GITHUB_SHA,os:os.type(),release:os.release(),arch:os.arch(),image:process.env.ImageOS,imageVersion:process.env.ImageVersion,node:process.version},null,2))'
          npm --version
          npx playwright --version

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit regression tests
        run: npm run test:unit

      - name: Audit dependency licenses
        run: npm run license:audit

      - name: Validate bundle scanner fixture
        run: npm run verify:bundle-license-fixture

      - name: Generate SBOM
        run: npm run sbom:generate

      - name: Build and aggregate notices
        run: npm run build

      - name: Verify compliance artifacts
        run: npm run compliance:verify

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Record Chromium version
        run: node --input-type=module -e 'import {chromium} from "playwright"; const browser = await chromium.launch(); console.log(browser.version()); await browser.close()'

      - name: Run browser regression tests
        run: npm run test:smoke

      - name: Confirm Vite development CSP styling
        run: npm run test:smoke:dev

      - name: Confirm Vite preview CSP enforcement
        run: npm run test:smoke:csp-preview

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.os }}
          path: |
            test-results/
            test-results-dev/
            test-results-csp-preview/
          retention-days: 7
