name: Bounded focus 102 evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  focus-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record host and browser
        run: |
          node --input-type=module -e 'import os from "node:os"; console.log(JSON.stringify({head:process.env.GITHUB_SHA,os:os.type(),release:os.release(),arch:os.arch(),image:process.env.ImageOS,imageVersion:process.env.ImageVersion,node:process.version}))'
          npm --version
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import {chromium} from "playwright"; const b=await chromium.launch(); console.log(b.version()); await b.close()'
      - name: Repeat original geometry and controlled readiness cases
        run: npm run test:smoke -- --grep "preserves keyboard focus across delayed|applies approved focus geometry" --repeat-each=6 --workers=2 --trace=on
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-102-evidence-${{ matrix.os }}
          path: test-results/
          retention-days: 7
