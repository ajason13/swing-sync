name: Issue 94 host verification

on:
  push:
    branches: ["fix/windows-command-launchers"]

permissions:
  contents: read

jobs:
  compliance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: checkout with spaces
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: checkout with spaces

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: checkout with spaces/package-lock.json

      - name: Record host evidence
        run: |
          node -e "console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,os:require('node:os').release(),image:process.env.ImageOS,imageVersion:process.env.ImageVersion,sha:process.env.GITHUB_SHA}))"
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit regression tests
        run: npm run test:unit

      - name: Audit dependency licenses
        run: npm run license:audit

      - name: Validate bundle scanner fixture
        run: npm run verify:bundle-license-fixture

      - name: Generate SBOM
        run: npm run sbom:generate

      - name: Build and aggregate notices
        run: npm run build

      - name: Verify compliance artifacts
        run: npm run compliance:verify

      - name: Install Playwright Chromium on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Record browser version
        run: node --input-type=module -e "import {chromium} from '@playwright/test'; const b = await chromium.launch({headless:true}); console.log(b.version()); await b.close();"

      - name: Run browser regression tests
        run: npm run test:smoke

      - name: Confirm Vite development CSP styling
        run: npm run test:smoke:dev

      - name: Confirm Vite preview CSP enforcement
        run: npm run test:smoke:csp-preview

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-94-${{ matrix.os }}
          path: |
            checkout with spaces/test-results/
            checkout with spaces/test-results-dev/
            checkout with spaces/test-results-csp-preview/
          retention-days: 7
